<!DOCTYPE html>
<html lang="en">
<head>

    <!--
    noVNC lite page for agent-sandbox (based on Debian novnc 1.6 vnc_lite.html).

    Changes vs package:
    - No top bar / CtrlAltDel overlay
    - Clipboard: Ctrl+V and Mac Command+V sync local browser text into the
      remote desktop via Clipboard API / paste event; Command+V also synthesizes
      Ctrl+V so Linux apps paste (Meta+V alone does not).

    Connect parameters are provided in query string:
        http://example.com/?host=HOST&port=PORT&scale=true
    -->
    <title>Desktop</title>

    <style>
        body {
            margin: 0;
            background-color: dimgrey;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        html {
            height: 100%;
        }
        #screen {
            flex: 1;
            overflow: hidden;
        }
    </style>

    <script type="module" crossorigin="anonymous">
        import RFB from './core/rfb.js';

        // X11 keysyms used when synthesizing Ctrl+V for Mac Command+V.
        const XK_Control_L = 0xffe3;
        const XK_v = 0x0076;

        let rfb;
        let clipSyncing = false;

        function readQueryVariable(name, defaultValue) {
            const re = new RegExp('.*[?&]' + name + '=([^&#]*)'),
                  match = document.location.href.match(re);

            if (match) {
                return decodeURIComponent(match[1]);
            }

            return defaultValue;
        }

        function sendClipboardToServer(text) {
            if (!rfb || text == null) {
                return;
            }
            rfb.clipboardPasteFrom(String(text));
        }

        function onServerClipboard(e) {
            const text = e.detail && e.detail.text != null ? e.detail.text : '';
            if (navigator.clipboard && navigator.clipboard.writeText && text) {
                navigator.clipboard.writeText(text).catch(() => {});
            }
        }

        async function syncBrowserClipboardToServer() {
            if (!rfb || clipSyncing) {
                return false;
            }
            clipSyncing = true;
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        sendClipboardToServer(text);
                        return true;
                    }
                }
            } catch (_) {
                // Permissions / non-secure context: paste event may still help.
            } finally {
                clipSyncing = false;
            }
            return false;
        }

        // Linux remote pastes on Ctrl+V; Mac Command+V must be translated.
        function sendRemoteCtrlV() {
            if (!rfb) {
                return;
            }
            rfb.sendKey(XK_Control_L, 'ControlLeft', true);
            rfb.sendKey(XK_v, 'KeyV', true);
            rfb.sendKey(XK_v, 'KeyV', false);
            rfb.sendKey(XK_Control_L, 'ControlLeft', false);
        }

        const host = readQueryVariable('host', window.location.hostname);
        let port = readQueryVariable('port', window.location.port);
        const password = readQueryVariable('password');
        const path = readQueryVariable('path', 'websockify');

        let url;
        if (window.location.protocol === "https:") {
            url = 'wss';
        } else {
            url = 'ws';
        }
        url += '://' + host;
        if (port) {
            url += ':' + port;
        }
        url += '/' + path;

        rfb = new RFB(document.getElementById('screen'), url,
                      { credentials: { password: password } });

        rfb.addEventListener("clipboard", onServerClipboard);

        rfb.viewOnly = readQueryVariable('view_only', false);
        rfb.scaleViewport = readQueryVariable('scale', false) ||
            readQueryVariable('resize', '') === 'scale';

        // Seamless path: sync local clipboard before Ctrl/Cmd+V reaches the remote.
        // Mac Command+V: intercept, sync, then synthesize Ctrl+V (remote is Linux).
        // Ctrl+V: sync only; let the native Ctrl+V key events through.
        window.addEventListener('keydown', (e) => {
            if (!(e.ctrlKey || e.metaKey)) {
                return;
            }
            if (e.key !== 'v' && e.key !== 'V' && e.code !== 'KeyV') {
                return;
            }
            const isCmdV = e.metaKey && !e.ctrlKey;
            if (isCmdV) {
                e.preventDefault();
                e.stopPropagation();
                syncBrowserClipboardToServer().then(() => {
                    sendRemoteCtrlV();
                });
                return;
            }
            syncBrowserClipboardToServer();
        }, true);

        window.addEventListener('paste', (e) => {
            const text = e.clipboardData && e.clipboardData.getData('text/plain');
            if (text) {
                sendClipboardToServer(text);
            }
        }, true);
    </script>
</head>

<body>
    <div id="screen"></div>
</body>
</html>
